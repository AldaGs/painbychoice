[package]
name = "motion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless document model + evaluation engine. No GPU, no windowing."

[dependencies]
kurbo.workspace = true
glam.workspace = true
serde.workspace = true
# The `.pbc` *is* JSON, and `core` now owns reading it (`Project::from_pbc`) so
# that a headless renderer and the editor cannot drift into two dialects.
serde_json.workspace = true
rhai.workspace = true
parley = "0.11"
skrifa = "0.43"
flo_curves = "0.8.0"

[dev-dependencies]
serde_json.workspace = true
