[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/app", "crates/live"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

# Shared dependency versions. Individual crates opt in.
[workspace.dependencies]
kurbo = { version = "0.13", features = ["serde"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = "1"

motion-core = { path = "crates/core" }
motion-render = { path = "crates/render" }

# The pixel effects run per preview frame on the CPU; unoptimized, a glow
# takes seconds a frame. Optimize just that crate even in dev builds.
[profile.dev.package.motion-render]
opt-level = 3
